<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#E96845" />
    <title>ListenLoop is offline</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, sans-serif; background: #FFF9F4; color: #251B18; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 360px; text-align: center; }
      .mark { width: 64px; height: 64px; margin: 0 auto 24px; border-radius: 20px; background: #E96845; display: grid; place-items: center; color: white; font-size: 30px; font-weight: 800; }
      h1 { font-size: 28px; margin: 0 0 12px; }
      p { color: #8A746C; line-height: 1.6; margin: 0; }
      button { margin-top: 24px; border: 0; border-radius: 14px; background: #251B18; color: white; padding: 13px 18px; font-weight: 700; font-size: 15px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">L</div>
      <h1>You’re offline</h1>
      <p>ListenLoop will reconnect when your internet connection is back. Your saved practice progress is stored on this device.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
